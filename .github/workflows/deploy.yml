# Uploads the public website to VShark's own Hostinger over SFTP (see SELF-HOSTING.md).
# - Builds the clean copy first (python build/publish.py --target apache): no source data, notes or scripts.
# - Run by hand: Actions -> "Deploy to Hostinger" -> Run workflow (pick the branch to deploy).
# - Automatic deploys on every push to main start only once the repository variable AUTO_DEPLOY is "true".
# - Files are uploaded and overwritten; nothing on the server is deleted (the form's secret config lives
#   outside the web folder and is never touched).
name: Deploy to Hostinger

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency: deploy-hostinger

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment settings
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DIR: ${{ secrets.DEPLOY_PATH }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$HOST" ] || [ -z "$DIR" ] || [ -z "$KEY" ] || [ -z "$KNOWN" ]; then
            echo "::error::Add the DEPLOY_HOST, DEPLOY_PORT, DEPLOY_USER, DEPLOY_PATH, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS secrets (see SELF-HOSTING.md)."
            exit 1
          fi

      - name: Build the public copy
        run: python3 build/publish.py --target apache

      - name: SSH key (server fingerprint pinned)
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts

      - name: Upload site
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          DIR: ${{ secrets.DEPLOY_PATH }}
        run: |
          # rsync over SSH: uploads only changed files; never deletes anything on the server
          rsync -rlt --checksum --itemize-changes \
            -e "ssh -i ~/.ssh/deploy -p ${PORT:-22} -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            dist/ "$USER@$HOST:$DIR/"
          echo "Deployed $(git rev-parse --short HEAD) to $DIR"
