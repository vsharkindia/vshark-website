# Uploads the public website to VShark's own Hostinger over SFTP (see SELF-HOSTING.md).
# - Builds the clean copy first (python build/publish.py --target apache): no source data, notes or scripts.
# - Run by hand: Actions -> "Deploy to Hostinger" -> Run workflow (pick the branch to deploy).
# - Automatic deploys on every push to main start only once the repository variable AUTO_DEPLOY is "true".
# - Files are uploaded and overwritten; nothing on the server is deleted (the form's secret config lives
#   outside the web folder and is never touched).
name: Deploy to Hostinger

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency: deploy-hostinger

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment settings
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DIR: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$HOST" ] || [ -z "$DIR" ]; then
            echo "::error::Add the DEPLOY_HOST, DEPLOY_PORT, DEPLOY_USER, DEPLOY_PASSWORD and DEPLOY_PATH secrets (see SELF-HOSTING.md)."
            exit 1
          fi

      - name: Build the public copy
        run: python3 build/publish.py --target apache

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload site
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          LFTP_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DIR: ${{ secrets.DEPLOY_PATH }}
          PROTO: ${{ vars.DEPLOY_PROTOCOL || 'sftp' }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes; set ftp:ssl-allow yes; set net:max-retries 2; set net:timeout 30;
            open -u '$USER' --env-password ${PORT:+-p $PORT} $PROTO://$HOST;
            mirror --reverse --parallel=4 --only-newer --no-perms --verbose=1 dist/ '$DIR'
          "
